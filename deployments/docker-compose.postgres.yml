services:
  postgres:
    image: postgres:16-alpine
    container_name: llmgateway-postgres
    environment:
      POSTGRES_DB: llmgateway
      POSTGRES_USER: llmgateway
      POSTGRES_PASSWORD: llmgateway_dev
    ports:
      - "5432:5432"
    volumes:
      - llmgateway_pgdata:/var/lib/postgresql/data

volumes:
  llmgateway_pgdata:
